<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER BREAK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a001f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', system-ui;
            color: #00ffcc;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            border: 8px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 60px #00ffcc;
        }
        
        canvas {
            display: block;
        }
        
        /* Menu Overlay */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 0, 30, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #menu h1 {
            font-size: 3.2rem;
            margin-bottom: 40px;
            text-shadow: 0 0 30px #00ffcc;
        }
        
        .menu-btn {
            background: transparent;
            border: 4px solid #00ffcc;
            color: #00ffcc;
            font-family: 'Press Start 2P', system-ui;
            font-size: 1.1rem;
            padding: 18px 50px;
            margin: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 280px;
        }
        
        .menu-btn:hover {
            background: #00ffcc;
            color: #0a001f;
            transform: scale(1.05);
        }
        
        #pause-menu {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 0, 30, 0.95);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .health-bar {
            position: absolute;
            height: 22px;
            background: #111;
            border: 4px solid #fff;
            z-index: 50;
        }
        
        .p1-health { left: 30px; top: 25px; width: 340px; }
        .p2-health { right: 30px; top: 25px; width: 340px; }
        
        .player-name {
            position: absolute;
            font-size: 15px;
            top: 55px;
            color: #fff;
            text-shadow: 2px 2px #000;
            z-index: 50;
        }
        
        .p1-name { left: 30px; }
        .p2-name { right: 30px; text-align: right; }
        
        #round-info {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 6px 20px;
            border-radius: 4px;
            z-index: 50;
        }
        
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            text-align: center;
            text-shadow: 4px 4px #000;
            z-index: 300;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="renderCanvas" width="1280" height="720"></canvas>
        
        <!-- Health bars -->
        <div class="health-bar p1-health">
            <div id="p1-health-fill" class="health-fill" style="width:100%; background:#00ff88; height:100%;"></div>
        </div>
        <div class="health-bar p2-health">
            <div id="p2-health-fill" class="health-fill" style="width:100%; background:#ff3366; height:100%;"></div>
        </div>
        
        <div class="player-name p1-name">NYRA VEX</div>
        <div class="player-name p2-name">BRAM KADE (AI)</div>
        <div id="round-info">ROUND 1 / 3</div>
        
        <!-- Main Menu -->
        <div id="menu">
            <h1>AETHER BREAK</h1>
            <button class="menu-btn" onclick="startGame()">START GAME</button>
            <button class="menu-btn" onclick="showSettings()">SETTINGS</button>
            <button class="menu-btn" onclick="exitGame()">EXIT</button>
        </div>
        
        <!-- Pause Menu -->
        <div id="pause-menu">
            <h2 style="margin-bottom: 40px;">PAUSED</h2>
            <button class="menu-btn" onclick="resumeGame()">RESUME</button>
            <button class="menu-btn" onclick="restartGame()">RESTART</button>
            <button class="menu-btn" onclick="exitToMenu()">EXIT TO MENU</button>
        </div>
        
        <div id="status"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
    
    <script>
        // Menu Control Functions
        let gameStarted = false;
        
        function startGame() {
            document.getElementById('menu').style.display = 'none';
            gameStarted = true;
            // The game loop in main.js will detect this
            window.dispatchEvent(new CustomEvent('game-start'));
        }
        
        function showSettings() {
            alert("Settings coming soon! (AI Difficulty, Volume, Controls)");
        }
        
        function exitGame() {
            if (confirm("Are you sure you want to exit?")) {
                window.close();
            }
        }
        
        function pauseGame() {
            document.getElementById('pause-menu').style.display = 'flex';
        }
        
        function resumeGame() {
            document.getElementById('pause-menu').style.display = 'none';
        }
        
        function restartGame() {
            location.reload();
        }
        
        function exitToMenu() {
            location.reload();
        }
        
        // Keyboard pause
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && gameStarted) {
                const pauseMenu = document.getElementById('pause-menu');
                if (pauseMenu.style.display === 'flex') {
                    resumeGame();
                } else {
                    pauseGame();
                }
            }
        });
        
        // Make functions global
        window.startGame = startGame;
        window.pauseGame = pauseGame;
    </script>
</body>
</html>
