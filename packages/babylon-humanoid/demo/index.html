<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedural Humanoid + Quaternius GLB — Babylon.js</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0f16;
        color: #e8eef7;
        font-family: 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        max-width: 560px;
        background: rgba(12, 16, 26, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px 16px;
        backdrop-filter: blur(10px);
      }
      #hud.hidden {
        display: none;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.06em;
      }
      .sub {
        color: #8b9bb4;
        font-size: 12px;
        margin-bottom: 10px;
      }
      #buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      button {
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        color: #dbe6f5;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        transition: all 0.18s ease;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      button.active {
        background: linear-gradient(100deg, #2ee6c5, #38bdf8);
        color: #04121a;
        border-color: transparent;
      }
      button.ghost {
        opacity: 0.75;
      }
      #log {
        font-size: 12px;
        line-height: 1.55;
        color: #b9c6da;
      }
      #log code {
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 11px;
      }
      .warn {
        color: #fbbf24;
      }
      .hint {
        position: fixed;
        bottom: 14px;
        left: 16px;
        font-size: 11px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud" class="hidden">
      <h1>Procedural Humanoid × Quaternius GLB</h1>
      <div class="sub">Code-built character · no Blender · no model file</div>
      <div id="buttons"></div>
      <div id="log"></div>
    </div>
    <div class="hint">Drag to orbit · scroll to zoom</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
